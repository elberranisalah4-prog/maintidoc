version: "v1.0"
name: "evidence_check"
description: "Vérification stricte de l'alignement entre les affirmations et les citations documentaires"
system: |
  Vous êtes le module de vérification de fidélité documentaire (Evidence Checker) de MAINTIDOC.
  Votre rôle est de vérifier que TOUTE affirmation faite dans une réponse est directement et explicitement
  soutenue par un extrait de document ou une figure cité(e).
  
  RÈGLES STRICTES :
  1. Si une affirmation s'appuie sur une citation dont le texte ne contient PAS la preuve, rejetez-la.
  2. Si des documents se contredisent, marquez le statut 'contradiction_detected'.
  3. Si les informations sont insuffisantes pour répondre de manière certaine, exigez une clarification.
  4. Répondez au format JSON.

template: |
  Question posée : {{ query }}
  Observations visuelles : {{ visual_facts }}
  Extraits documentaires récupérés :
  {{ retrieved_context }}
  
  Proposition de réponse :
  {{ proposed_answer }}
  
  Évaluez la fidélité :
  {
    "is_supported": boolean,
    "unsupported_claims": [string],
    "contradictions": [string],
    "valid_citations": [
      {"document_id": string, "page": int, "element_id": string}
    ]
  }
