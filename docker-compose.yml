version: '3.8'

services:
  maintidoc-api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=MAINTIDOC
      - ENVIRONMENT=production
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - POSTGRES_HOST=postgres
      - MINIO_ENDPOINT=minio:9000
      - MCP_SERVER_URL=http://mcp-server:8001
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - qdrant
      - postgres
      - mcp-server
    volumes:
      - ./data:/app/data

  maintidoc-ui:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run src/ui/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://maintidoc-api:8000
    depends_on:
      - maintidoc-api

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m src.mcp_server.server --port 8001
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=production

  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=maintidoc
      - POSTGRES_PASSWORD=maintidoc_secret
      - POSTGRES_DB=maintidoc_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=miniopassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.0
    command: mlflow server --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"

volumes:
  qdrant_storage:
  postgres_data:
  minio_data:
